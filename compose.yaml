services:
  server:
    build:
      context: .
      target: development
    ports:
      - 9000:80
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db-password
    environment:
      - PASSWORD_FILE_PATH=/run/secrets/db-password
      - DB_HOST=db
      - DB_NAME=root
      - DB_USER=root
    develop:
      watch:
        - action: sync
          path: ./src
          target: /var/www/html
  db:
    image: mariadb:11
    restart: always
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MARIADB_DATABASE=example
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/db-password
    ports:
      - 127.0.0.1:3306:3306
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
  phpmyadmin:
    image: phpmyadmin
    ports:
      - 9009:80
    depends_on:
      - db
    environment:
      - PMA_HOST=db
  tailwind:
    image: node:22-alpine
    working_dir: /app
    user: "1000:1000"
    volumes:
      - ./:/app
    command: npx @tailwindcss/cli -i ./src/public/tailwind/input.css -o ./src/public/css/output.css --watch=always
volumes:
  db-data:
secrets:
  db-password:
    file: db/password.txt